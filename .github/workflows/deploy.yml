name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Change to your primary branch name

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # CRITICAL STEP: Pull files with Git LFS enabled
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # If you are hosting a simple HTML/static site, upload the directory directly
      # Replace "./" with your build output folder (e.g., "./dist") if using a framework
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
